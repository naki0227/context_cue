<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>How to Talkをインストール／更新</title>
    <style>
      :root {
        color: #16221d;
        background: #eef3ed;
        font-family: "Avenir Next", "Hiragino Sans", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(circle at 10% 15%, #d6e7d8 0 12%, transparent 36%),
          linear-gradient(145deg, #f7f4e8, #e3eee8);
      }
      main {
        width: min(720px, 100%);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid #bfd0c5;
        border-radius: 28px;
        background: rgba(255, 255, 250, 0.92);
        box-shadow: 0 24px 70px rgba(31, 58, 46, 0.14);
      }
      .eyebrow {
        margin: 0 0 10px;
        color: #337056;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 560px;
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.6rem);
        line-height: 1.03;
        letter-spacing: -0.045em;
      }
      .title-line { display: block; }
      .no-break { white-space: nowrap; }
      .lead { margin: 22px 0 8px; font-size: 1.08rem; line-height: 1.8; }
      .privacy { margin: 0 0 28px; color: #52635b; font-size: 0.92rem; }
      #status {
        margin: 0 0 14px;
        padding: 12px 15px;
        border-radius: 12px;
        background: #e9f3ec;
        color: #23543f;
        font-weight: 700;
      }
      .downloads { display: grid; gap: 12px; }
      .download {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 62px;
        padding: 14px 18px;
        border: 1px solid #9db6a7;
        border-radius: 16px;
        color: inherit;
        text-decoration: none;
        transition: transform 160ms ease, border-color 160ms ease;
      }
      .download:hover { transform: translateY(-2px); border-color: #286849; }
      .download.recommended { color: white; background: #176443; border-color: #176443; }
      .download small { display: block; margin-top: 3px; opacity: 0.76; }
      .arrow { font-size: 1.3rem; }
      footer { margin-top: 26px; color: #65726c; font-size: 0.82rem; line-height: 1.6; }
      [hidden] { display: none !important; }
      @media (max-width: 560px) {
        body { padding: 18px 12px; }
        main { padding: 28px 24px; border-radius: 22px; overflow: hidden; }
        h1 { font-size: clamp(2rem, 11vw, 3rem); }
        .lead { font-size: 1rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Local-first conversation support</p>
      <h1>
        <span class="title-line">インストールも、</span>
        <span class="title-line">更新も、<span class="no-break">ここから。</span></span>
      </h1>
      <p class="lead">
        端末に合うインストーラを案内します。既にHow to Talkがある場合は、
        同じインストーラが更新として動作し、ローカルデータを引き継ぎます。
      </p>
      <p class="privacy">判定はブラウザ内だけで行い、解析Cookieは使用しません。</p>
      <p id="status" role="status">公開中の最新版を確認しています。</p>
      <div class="downloads" id="downloads" hidden></div>
      <footer>
        macOSではブラウザからCPU種別を確定できない場合があります。
        M1以降はApple Silicon、古いMacはIntelを選択してください。
      </footer>
    </main>
    <script>
      const repository = "enludus/How-to-talk";
      const assets = {
        macArm: ["How-to-Talk-macOS-Apple-Silicon.dmg", "macOS", "Apple Silicon (M1以降)"],
        macIntel: ["How-to-Talk-macOS-Intel.dmg", "macOS", "Intel Mac"],
        windows: ["How-to-Talk-Windows-x64-Setup.exe", "Windows", "64-bit"],
        linux: ["How-to-Talk-Linux-x64.AppImage", "Linux", "64-bit AppImage"],
      };

      function detectedPlatform() {
        const value = `${navigator.platform} ${navigator.userAgent}`.toLowerCase();
        if (value.includes("mac")) return "mac";
        if (value.includes("win")) return "windows";
        if (value.includes("linux")) return "linux";
        return "unknown";
      }

      function visibleAssets(platform) {
        if (platform === "mac") return ["macArm", "macIntel"];
        if (platform === "windows") return ["windows"];
        if (platform === "linux") return ["linux"];
        return Object.keys(assets);
      }

      function render(releaseAssets) {
        const platform = detectedPlatform();
        const container = document.querySelector("#downloads");
        const available = new Map(releaseAssets.map((asset) => [asset.name, asset.browser_download_url]));
        const keys = visibleAssets(platform);
        container.replaceChildren();

        for (const [index, key] of keys.entries()) {
          const [filename, os, detail] = assets[key];
          const href = available.get(filename);
          if (!href) continue;
          const link = document.createElement("a");
          link.className = `download${index === 0 ? " recommended" : ""}`;
          link.href = href;
          link.innerHTML = `<span><strong>${os}</strong><small>${detail}</small></span><span class="arrow">↓</span>`;
          container.append(link);
        }

        container.hidden = container.childElementCount === 0;
        document.querySelector("#status").textContent = container.hidden
          ? "最新版のインストーラを確認できませんでした。Releaseページをご利用ください。"
          : "お使いの端末向け候補を表示しています。";
      }

      fetch(`https://api.github.com/repos/${repository}/releases`)
        .then((response) => {
          if (!response.ok) throw new Error("release lookup failed");
          return response.json();
        })
        .then((releases) => {
          const release = releases.find((item) => !item.draft);
          if (!release) throw new Error("published release not found");
          render(release.assets);
        })
        .catch(() => {
          document.querySelector("#status").innerHTML =
            `<a href="https://github.com/${repository}/releases">Releaseページから選択してください。</a>`;
        });
    </script>
  </body>
</html>
