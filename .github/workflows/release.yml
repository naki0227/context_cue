name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.17.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libasound2-dev libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Validate release metadata
        run: pnpm release:check -- --tag "$RELEASE_TAG"

      - name: Audit privacy and secrets
        run: |
          pnpm audit:privacy
          pnpm audit:release-repository

      - name: Validate frontend
        run: |
          pnpm audit --audit-level high
          pnpm spec:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Validate Rust workspace
        run: |
          cargo audit
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo check --workspace
          cargo test --workspace
          cargo build --workspace

  publish-tauri:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Remove local paths from Rust artifacts
        shell: bash
        run: |
          CARGO_SOURCE_HOME="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$CARGO_SOURCE_HOME=.cargo" >>"$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "CFLAGS=-fPIC -ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CXXFLAGS=-fPIC -ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CMAKE_C_FLAGS=-fPIC -ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CMAKE_CXX_FLAGS=-fPIC -ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
          elif [ "$RUNNER_OS" != "Windows" ]; then
            echo "CFLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CXXFLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CMAKE_C_FLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CMAKE_CXX_FLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.17.0 --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Configure Apple signing when available
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_SECRET" ]; then
            printf '%s\n' \
              "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_SECRET" \
              "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_SECRET" \
              "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" \
              "APPLE_ID=$APPLE_ID_SECRET" \
              "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET" \
              "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >>"$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >>"$GITHUB_ENV"
          fi

      - name: Configure Windows signing when available
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_SECRET: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE_SECRET" ]; then
            printf '%s\n' \
              "WINDOWS_CERTIFICATE=$WINDOWS_CERTIFICATE_SECRET" \
              "WINDOWS_CERTIFICATE_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD_SECRET" >>"$GITHUB_ENV"
          fi

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: corepack pnpm tauri
          owner: enludus
          repo: How-to-talk
          releaseCommitish: main
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "How to Talk ${{ env.RELEASE_TAG }}"
          releaseBody: |
            ## ベータ版について

            このReleaseは、動作確認とフィードバック収集を目的としたベータ版です。
            重要な業務や、失うと困るデータを扱う用途には使用しないでください。

            現在のmacOS版はアドホック署名のみで、Developer ID署名・Appleの公証が
            ありません。Windows版にもコード署名がありません。そのため、OSから
            開発元を確認できない旨の警告が表示されます。会社や学校の管理対象端末では
            起動できない場合があります。

            ## ダウンロード前の確認

            - このReleaseページに添付されたファイルだけを使用してください
            - お使いのOSに合うファイル名であることを確認してください
            - 対応する`.sha256`があるファイルは、実行前にSHA-256を照合してください

            ## macOSでこのアプリだけを許可する

            1. `.dmg`をダウンロードし、通常どおりアプリを開いて警告を確認します
            2. Appleメニューの「システム設定」から「プライバシーとセキュリティ」を開きます
            3. How to Talkがブロックされた旨の表示で「このまま開く」を選びます
            4. Touch IDまたはログインパスワードで許可し、もう一度「開く」を選びます

            「このまま開く」がない場合は、先に一度アプリを開こうとしてから
            約1時間以内に同じ画面を確認してください。「壊れているため開けない」と
            表示された場合は保護機能を無効化せず、Issueで報告してください。

            ## Windowsでこのアプリだけを許可する

            1. `.msi`または`.exe`をダウンロードして実行します
            2. SmartScreenの「WindowsによってPCが保護されました」で「詳細情報」を選びます
            3. アプリ名がHow to Talk、発行元が「不明な発行元」であることを確認します
            4. このReleaseページから取得したファイルであることを再確認し、「実行」を選びます

            「実行」が表示されない管理対象端末では、端末の保護設定を無効化せず、
            管理者の判断に従ってください。

            ## 不具合報告

            起動できない場合は、個人情報を含めず、OSの種類・バージョン・
            ダウンロードしたファイル名・表示されたエラーをIssueへ記載してください。
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}

  publish-cli:
    needs: publish-tauri
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/how-to-talk
            archive: how-to-talk-aarch64-apple-darwin.tar.gz
          - platform: macos-latest
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/how-to-talk
            archive: how-to-talk-x86_64-apple-darwin.tar.gz
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/how-to-talk
            archive: how-to-talk-x86_64-unknown-linux-gnu.tar.gz
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/how-to-talk.exe
            archive: how-to-talk-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Remove local paths from Rust artifacts
        shell: bash
        run: |
          CARGO_SOURCE_HOME="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$CARGO_SOURCE_HOME=.cargo" >>"$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "CFLAGS=-fPIC -ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CXXFLAGS=-fPIC -ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CMAKE_C_FLAGS=-fPIC -ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CMAKE_CXX_FLAGS=-fPIC -ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
          elif [ "$RUNNER_OS" != "Windows" ]; then
            echo "CFLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CXXFLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CMAKE_C_FLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
            echo "CMAKE_CXX_FLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=." >>"$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --locked -p context-cue-cli --target ${{ matrix.target }}

      - name: Smoke test CLI CRUD
        shell: bash
        run: |
          CLI="${{ matrix.binary }}"
          DATA_DIR="$RUNNER_TEMP/how-to-talk-cli-smoke"
          mkdir -p "$DATA_DIR"
          "$CLI" --version
          "$CLI" spec >/dev/null
          "$CLI" schema knowledge >/dev/null
          CREATE_OUTPUT="$(printf '%s' '{"title":"release-smoke","content":["temporary"],"source":"release-workflow","tag":"smoke"}' | "$CLI" --data-dir "$DATA_DIR" create knowledge --data -)"
          ITEM_ID="$(printf '%s' "$CREATE_OUTPUT" | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(value).data.id));')"
          "$CLI" --data-dir "$DATA_DIR" get knowledge "$ITEM_ID" >/dev/null
          printf '%s' '{"confidence":"確認済み"}' | "$CLI" --data-dir "$DATA_DIR" update knowledge "$ITEM_ID" --data - >/dev/null
          "$CLI" --data-dir "$DATA_DIR" delete knowledge "$ITEM_ID" >/dev/null
          "$CLI" --data-dir "$DATA_DIR" list knowledge | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => { if (JSON.parse(value).data.length !== 0) process.exit(1); });'

      - name: Package CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.binary }}" release/how-to-talk
          tar -czf "release/${{ matrix.archive }}" -C release how-to-talk
          if command -v sha256sum >/dev/null; then
            sha256sum "release/${{ matrix.archive }}" >"release/${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "release/${{ matrix.archive }}" >"release/${{ matrix.archive }}.sha256"
          fi

      - name: Package CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "${{ matrix.binary }}" release/how-to-talk.exe
          Compress-Archive -Path release/how-to-talk.exe -DestinationPath "release/${{ matrix.archive }}"
          $hash = (Get-FileHash "release/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Set-Content "release/${{ matrix.archive }}.sha256"

      - name: Upload CLI release assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          repository: enludus/How-to-talk
          tag_name: ${{ env.RELEASE_TAG }}
          name: "How to Talk ${{ env.RELEASE_TAG }}"
          draft: true
          generate_release_notes: false
          files: |
            release/${{ matrix.archive }}
            release/${{ matrix.archive }}.sha256
