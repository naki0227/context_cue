name: Sync Release Repository

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate public repository contents
        run: |
          node scripts/privacy-audit.mjs
          node scripts/release-repository-audit.mjs

      - name: Update isolated public repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone enludus/How-to-talk public
          rsync -a --delete --exclude ".git" distribution/release-repository/ public/
          git -C public config user.name "How to Talk Release"
          git -C public config user.email "enludus@users.noreply.github.com"
          git -C public add --all
          if git -C public diff --cached --quiet; then
            exit 0
          fi
          git -C public commit -m "chore: update release repository"
          git -C public push origin main
