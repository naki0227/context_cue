[package]
name = "how-to-talk-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "how_to_talk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.91"
context-cue-contracts = { path = "../../../crates/context-cue-contracts" }
context-cue-core = { path = "../../../crates/context-cue-core" }
context-cue-workspace = { path = "../../../crates/context-cue-workspace" }
cpal = "0.18.1"
dirs = "6"
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sysinfo = "0.39.6"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
whisper-rs = "0.16.0"

[target.'cfg(target_os = "windows")'.dependencies]
# Keep CPAL's windows and windows-core bindings on the same ABI generation.
windows-core = "=0.62.2"

[dev-dependencies]
tempfile = "3"
