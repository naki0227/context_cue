[package]
name = "context-cue-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "how-to-talk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
context-cue-workspace = { path = "../context-cue-workspace" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
